<title>SkillBridge Prototype - Team Catalyst</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#F4F7FA;--card:#fff;--ink:#0B2545;--sub:#4A5568;--teal:#13A89E;--amber:#F4A300;--red:#E5243B;--line:#e2e8f0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1b2a;--card:#16283c;--ink:#f1f5f9;--sub:#a9b8c8;--line:#27405a}}
:root[data-theme="dark"]{--bg:#0d1b2a;--card:#16283c;--ink:#f1f5f9;--sub:#a9b8c8;--line:#27405a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Calibri,"Segoe UI","Noto Sans Devanagari","Noto Sans Tamil",Arial,sans-serif}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.app{max-width:440px;margin:0 auto;min-height:100vh;padding:16px 16px 84px}
.top{background:#0B2545;color:#fff;border-radius:16px;padding:16px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.top h1{margin:0;font-size:22px}.top p{margin:4px 0 0;font-size:13px;color:#cbd5e1}
.note{font-size:12px;color:var(--sub);text-align:center;margin:0 0 10px}
.langs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:20px;font-size:14px;cursor:pointer}
.chip.big{padding:10px 16px;font-size:16px}
.chip.on{background:var(--teal);border-color:var(--teal);color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 10px;text-align:center;font-size:15px;font-weight:700;cursor:pointer;color:var(--ink)}
.tile-wide{grid-column:1/-1}
.tile span{display:block;font-size:30px;margin-bottom:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.card h3{margin:0 0 4px;font-size:16px}.card p{margin:2px 0;font-size:13px;color:var(--sub)}
.badge{display:inline-block;background:#d1fae5;color:#065f46;font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;margin-left:6px}
.btn{background:var(--teal);color:#fff;border:0;border-radius:12px;padding:12px;font-size:15px;font-weight:700;width:100%;cursor:pointer;margin-top:8px}
.btn.alt{background:var(--amber);color:#0B2545}.btn.red{background:var(--red)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.back{background:none;border:0;color:var(--teal);font-size:15px;font-weight:700;cursor:pointer;padding:6px 0;margin-bottom:6px}
.mic{width:84px;height:84px;border-radius:50%;background:var(--red);color:#fff;font-size:34px;border:0;display:block;margin:6px auto;cursor:pointer}
.mic.live{animation:p 1s infinite}@keyframes p{50%{transform:scale(1.1)}}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.say{text-align:center;font-size:13px;color:var(--sub)}
select,input[type=range]{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:15px;margin:6px 0}
.ivr{background:#0B2545;color:#fff;border-radius:14px;padding:14px;font-size:15px;line-height:1.55;margin-bottom:10px}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}
.key{height:56px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:22px;font-weight:700;cursor:pointer}
.key:active{background:var(--teal);color:#fff}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px;margin:10px 0 4px;color:var(--ink);line-height:1.45}
.chk input{width:22px;height:22px;flex:none;margin-top:1px;accent-color:var(--teal)}
details summary{cursor:pointer;color:var(--teal);font-weight:700;font-size:14px;padding:6px 0}
details p{line-height:1.5}
.listen{position:fixed;z-index:5;bottom:calc(16px + env(safe-area-inset-bottom,0px));right:max(16px,calc(50vw - 204px));background:var(--teal);color:#fff;border:0;border-radius:28px;padding:14px 20px;font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.hide{display:none}
.orb{border:0;border-radius:50%;background:radial-gradient(circle at 30% 25%,#7df9e6,#13A89E 45%,#5b4bdb 100%);box-shadow:0 0 0 0 rgba(19,168,158,.55),0 0 22px rgba(91,75,219,.55);display:grid;place-items:center;cursor:pointer;animation:glow 2.6s infinite}
.orb.sm{width:52px;height:52px;flex:none}.orb.lg{width:112px;height:112px}
.orb svg{width:46%;height:46%}
.orb.live{animation:glow .8s infinite}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(19,168,158,.55),0 0 22px rgba(91,75,219,.5)}70%{box-shadow:0 0 0 18px rgba(19,168,158,0),0 0 30px rgba(91,75,219,.6)}100%{box-shadow:0 0 0 0 rgba(19,168,158,0),0 0 22px rgba(91,75,219,.5)}}
@media (prefers-reduced-motion:reduce){.orb,.mic.live,.orb.live,.bars i{animation:none!important}}
.orbwrap{text-align:center;margin:8px 0 12px}
.menu{background:rgba(255,255,255,.15);border:0;color:#fff;font-size:22px;width:44px;height:44px;border-radius:12px;cursor:pointer;flex:none}
.top>div{flex:1}
#drawer{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);z-index:10;display:none}
#drawer.open{display:block}
.dr{width:78%;max-width:320px;height:100%;background:var(--card);padding:calc(16px + env(safe-area-inset-top,0px)) 16px 16px;overflow:auto}
.dr button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:14px 4px;font-size:16px;color:var(--ink);cursor:pointer}
.bars{display:flex;gap:4px;justify-content:center;align-items:center;height:30px;margin-top:10px}
.bars i{width:4px;height:8px;border-radius:2px;background:var(--teal)}
.orb.live~.bars i{animation:bar .8s infinite ease-in-out}
.bars i:nth-child(2){animation-delay:.1s!important}.bars i:nth-child(3){animation-delay:.2s!important}.bars i:nth-child(4){animation-delay:.3s!important}.bars i:nth-child(5){animation-delay:.4s!important}
@keyframes bar{50%{height:28px}}
input[type=text]{padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:15px}
/* Laptop and desktop layout. Phones (under 800px) keep the layout above unchanged. */
@media (min-width:800px){
 .app{max-width:1120px;padding:28px 32px 104px}
 .top{padding:22px 28px;border-radius:20px;margin-bottom:14px}
 .top h1{font-size:32px}.top p{font-size:15px;margin-top:6px}
 .menu{width:48px;height:48px}
 .orb.sm{width:60px;height:60px}
 .note{font-size:13px;margin-bottom:18px}
 .listen{right:max(24px,calc(50vw - 560px + 24px))}

 /* inner pages: centred reading column, card lists flow into columns */
 #work,#schol,#learn,#comm,#ai,#call,#emerg,#prov{max-width:980px;margin:0 auto}
 #emerg,#call,#ai,#prov{max-width:760px}
 #jobs,#smatch,#pj{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;align-items:start}
 #jobs .card,#smatch .card,#pj .card,#sreal .card,#lres .card{margin-bottom:0}
 #sreal{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;align-items:start;margin-top:14px}
 #sreal>h3,#sreal>.say,#sreal>.card:first-child{grid-column:1/-1}
 #sreal>h3{margin:10px 0 0!important}
 #lres{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;align-items:start;margin-bottom:14px}
 #schol>.card:first-of-type{max-width:760px;margin-left:auto;margin-right:auto}
 #smatch{margin-top:14px}
 .mic{width:96px;height:96px;font-size:38px}
 .chips{justify-content:center}
 #learn .say,#work .say{text-align:center}
 .kp{max-width:360px;margin-left:auto;margin-right:auto}
 .ivr{font-size:16px}

 /* home */
 .langs{justify-content:center}
 .grid{grid-template-columns:repeat(3,1fr);gap:16px}
 .tile{padding:30px 14px;font-size:17px;border-radius:18px;transition:transform .15s,border-color .15s,box-shadow .15s}
 .tile span{font-size:42px;margin-bottom:10px}
 .tile-wide{grid-column:auto}
 #home>.card{max-width:720px;margin:18px auto 0!important;padding:20px}
 #home>.card h3{font-size:18px}#home>.card p{font-size:15px;line-height:1.5}
 .card{padding:18px;border-radius:16px}
 .card h3{font-size:17px}.card p{font-size:14px}
 .btn{width:auto;min-width:200px;padding:12px 22px}
 #emerg .btn,#call .btn,#ai .btn,#prov .btn,#schol .btn{width:100%}
 #jobs .btn,#sreal .btn,#lres .btn,#smatch .btn{width:100%}
 .dr{max-width:340px}
}
@media (min-width:1050px){
 .grid{grid-template-columns:repeat(5,1fr)}
}
@media (min-width:800px) and (hover:hover){
 .tile:hover{transform:translateY(-3px);border-color:var(--teal);box-shadow:0 8px 20px rgba(11,37,69,.12)}
 .chip:hover{border-color:var(--teal)}
 .btn:hover{filter:brightness(1.07)}
 .dr button:hover{background:rgba(19,168,158,.1)}
}
</style>

/* voice */
function say(parts){try{speechSynthesis.cancel();parts.forEach(p=>{const u=new SpeechSynthesisUtterance(p[0]);u.lang=p[1];speechSynthesis.speak(u)})}catch(e){}}
function listenBtn(){
 if(!("speechSynthesis" in window)){const b=$("lisT");b.textContent=t("novoice");setTimeout(()=>{b.textContent=t("listen")},2200);return}
 if(speechSynthesis.speaking){speechSynthesis.cancel();return}
 const v=[...document.querySelectorAll("section")].find(s=>!s.classList.contains("hide"));
 if(!v)return;
 if(v.id==="call"){say(ivS==="off"?[[t("c_p"),SR[cur]]]:ivrParts());return}
 say([[v.innerText.replace(/\s+/g," ").slice(0,700),SR[cur]]])
}

/* navigation and language */
function go(id){
 ["home","work","schol","learn","emerg","call","ai","prov","comm"].forEach(s=>$(s).classList.toggle("hide",s!==id));
 $("lis").classList.toggle("hide",id==="prov"||id==="comm");
 if(id!=="call"&&ivS!=="off")ivEnd();else{try{speechSynthesis.cancel()}catch(e){}}
 window.scrollTo(0,0)
}
function fillSel(id,keys){const s=$(id),i=s.selectedIndex<0?0:s.selectedIndex;s.innerHTML=keys.map(k=>`<option>${t(k)}</option>`).join("");s.selectedIndex=i}

function setLang(n){cur=n;applyLang()}
function applyLang(){
 $("langs").innerHTML=Object.keys(S).map(k=>`<button class="chip big ${k===cur?"on":""}" onclick="setLang('${k}')">${k}</button>`).join("");
 document.querySelectorAll("[data-i]").forEach(e=>{e.textContent=t(e.dataset.i)});
 document.querySelectorAll("[data-h]").forEach(e=>{e.innerHTML=t(e.dataset.h)});
 document.documentElement.lang=SR[cur].slice(0,2);
 fillSel("lvl",["lvl0","lvl1","lvl2"]);fillSel("inc",["inc0","inc1","inc2"]);fillSel("etype",ek);

/* free courses */
var lastLearn=null;
function learnChips(){$("lchips").innerHTML=Object.keys(CR).map(k=>`<button class="chip big ${k===lastLearn?"on":""}" onclick="learn('${k}')">${IC[k]} ${tx(k)}</button>`).join("")}

  :sid(c.q,true)}

learn:["Free skill courses. Government training can help you earn more. A volunteer can help you register on the Skill India Digital Hub and check if you qualify for free training. Press 0 for a volunteer. Press star for the main menu.","मुफ़्त कौशल कोर्स। सरकारी प्रशिक्षण से आप ज़्यादा कमा सकते हैं। स्वयंसेवक आपको स्किल इंडिया डिजिटल हब पर रजिस्टर करने और मुफ़्त प्रशिक्षण की पात्रता देखने में मदद कर सकता है। स्वयंसेवक के लिए 0 दबाएँ। मुख्य मेनू के लिए स्टार दबाएँ।","இலவச திறன் படிப்புகள். அரசு பயிற்சி நீங்கள் அதிகம் சம்பாதிக்க உதவும். ஸ்கில் இந்தியா டிஜிட்டல் ஹப்பில் பதிவு செய்யவும், இலவசப் பயிற்சிக்குத் தகுதி உள்ளதா என்று பார்க்கவும் தன்னார்வலர் உதவலாம். தன்னார்வலருக்கு 0 ஐ அழுத்தவும். முதன்மை மெனுவுக்கு நட்சத்திரம் அழுத்தவும்."],
voly:["Please wait. A volunteer from the NGO help desk will call you in a few minutes. They will ask your name, skill and area, and create your profile only with your permission. You can ask them to delete it at any time. Press star for the main menu.","कृपया प्रतीक्षा करें। एनजीओ हेल्प डेस्क का स्वयंसेवक कुछ मिनट में आपको फ़ोन करेगा। वह आपका नाम, हुनर और इलाका पूछेगा और आपकी अनुमति से ही आपकी प्रोफ़ाइल बनाएगा। आप कभी भी उसे हटाने को कह सकते हैं। मुख्य मेनू के लिए स्टार दबाएँ।","தயவுசெய்து காத்திருக்கவும். என்ஜிஓ உதவி மையத்தின் தன்னார்வலர் சில நிமிடங்களில் உங்களை அழைப்பார். அவர் உங்கள் பெயர், திறன் மற்றும் பகுதியைக் கேட்டு, உங்கள் அனுமதியுடன் மட்டுமே சுயவிவரத்தை உருவாக்குவார். எப்போது வேண்டுமானாலும் அதை நீக்கச் சொல்லலாம். முதன்மை மெனுவுக்கு நட்சத்திரம் அழுத்தவும்."],
voln:["Please wait. A volunteer will call you in a few minutes. You chose not to share details, so they will only answer your questions. Press star for the main menu.","कृपया प्रतीक्षा करें। स्वयंसेवक कुछ मिनट में आपको फ़ोन करेगा। आपने जानकारी साझा न करने का चुनाव किया है, इसलिए वह सिर्फ़ आपके सवालों के जवाब देगा। मुख्य मेनू के लिए स्टार दबाएँ।","தயவுசெய்து காத்திருக்கவும். தன்னார்வலர் சில நிமிடங்களில் உங்களை அழைப்பார். நீங்கள் விவரங்களைப் பகிர வேண்டாம் என்று தேர்ந்தெடுத்ததால், அவர் உங்கள் கேள்விகளுக்கு மட்டும் பதிலளிப்பார். முதன்மை மெனுவுக்கு நட்சத்திரம் அழுத்தவும்."],
bad:["Sorry, that key is not on the menu. Press # to hear it again.","माफ़ कीजिए, यह बटन मेनू में नहीं है। दोबारा सुनने के लिए # दबाएँ।","மன்னிக்கவும், இந்த எண் மெனுவில் இல்லை. மீண்டும் கேட்க # ஐ அழுத்தவும்."]
};
const JK={"1":"Tailor","2":"Driver","3":"Housemaid","4":"Cook"};
var ivS="off",ivL=0,ivC=null,ivX=null;
function ivrParts(){
 if(ivS==="ring")return [[t("c_ring"),SR[cur]]];
 if(ivS==="lang")return [["SkillBridge. தமிழுக்கு 1 ஐ அழுத்தவும்.","ta-IN"],["हिंदी के लिए 2 दबाएँ।","hi-IN"],["For English, press 3.","en-IN"]];
 var m;
 if(ivS==="job"){const v=txJob(J[ivX][0],ivL);m=IV.job[ivL].replace("{t}",v[0]).replace("{a}",v[1]).replace("{p}",v[2])}
 else if(ivS==="vol")m=(ivC?IV.voly:IV.voln)[ivL];
 else m=IV[ivS][ivL];
 return [[m,LC[ivL]]]
}
function ivShow(bad){const p=ivrParts();if(bad)p.unshift([IV.bad[ivL],LC[ivL]]);$("ivr").innerHTML="📞 "+p.map(x=>x[0]).join("<br>");say(p)}
function ivIdle(){if(ivS==="off")$("ivr").textContent="📵 "+t("c_idle")}
function ivStart(){ivS="ring";ivC=null;ivL=0;$("kp").classList.remove("hide");$("cbtn").classList.add("hide");$("cend").classList.remove("hide");ivShow();setTimeout(()=>{if(ivS==="ring"){ivS="lang";ivShow()}},1800)}
function ivEnd(){ivS="off";try{speechSynthesis.cancel()}catch(e){}$("kp").classList.add("hide");$("cbtn").classList.remove("hide");$("cend").classList.add("hide");ivIdle()}
function ivrKey(k){
 if(ivS==="off"||ivS==="ring")return;
 var bad=false;
 if(k==="#"){}
 else if(ivS==="lang"){if(k==="1")ivL=2;else if(k==="2")ivL=1;else if(k==="3")ivL=0;else bad=true;if(!bad)ivS="consent"}
 else if(ivS==="consent"){if(k==="1"){ivC=true;ivS="main"}else if(k==="2"){ivC=false;ivS="main"}else if(k==="0")ivS="vol";else bad=true}
 else if(k==="*")ivS="main";
 else if(k==="0")ivS="vol";
 else if(ivS==="main"){if(k==="1")ivS="jobs";else if(k==="2")ivS="schol";else if(k==="3")ivS=ivC?"emerg":"ec";else if(k==="4")ivS="learn";else bad=true}
 else if(ivS==="jobs"){if(JK[k]){ivX=JK[k];ivS="job"}else bad=true}
 else if(ivS==="job"){if(k==="9")ivS="emp";else bad=true}
 else if(ivS==="emerg"){if(k==="1"||k==="2"||k==="3")ivS="eok";else bad=true}
 else if(ivS==="ec"){if(k==="1"){ivC=true;ivS="emerg"}else bad=true}
 else bad=true;
 ivShow(bad)
}
$("kp").innerHTML=["1","2","3","4","5","6","7","8","9","*","0","#"].map(k=>`<button class="key" onclick="ivrKey('${k}')">${k}</button>`).join("");

/* AI voice assistant (demo keyword matching) */
function aiText(){$("aih").textContent="🤖 "+t("ai_h");$("aid").textContent=t("ai_d");$("aihint").textContent=t("ai_hint");$("aitxt").placeholder=t("ai_ph");$("aisend").textContent=t("ai_send");
 $("aiq").innerHTML=t("ai_q").map((q,i)=>`<button class="chip" onclick="ask(this.textContent,${i})">${q}</button>`).join("")}
function aiListen(){const m=$("aimic");const SRC=window.SpeechRecognition||window.webkitSpeechRecognition;if(SRC){try{const r=new SRC();r.lang=SR[cur];m.classList.add("live");r.onresult=e=>ask(e.results[0][0].transcript);r.onend=()=>m.classList.remove("live");r.start();return}catch(e){m.classList.remove("live")}}m.classList.add("live");setTimeout(()=>{m.classList.remove("live");ask(t("ai_q")[0],0)},1400)}
function ask(x0,i){if(!x0)return;const x=x0.toLowerCase();var k=i;
 if(k===undefined){k=3;
  if(/learn|course|training|सीख|कोर्स|प्रशिक्षण|ट्रेनिंग|கற்க|கற்று|பயிற்சி|கோர்ஸ்/.test(x))k=4;
  else if(/scholar|study|school|college|daughter|son\b|education|छात्रवृत्ति|पढ़ाई|स्कूल|बेटी|உதவித்தொகை|படிப்பு|பள்ளி|மகள்/.test(x))k=1;
  else if(/money|hospital|medical|accident|emergency|food|sick|पैसे|अस्पताल|दवा|आपातकाल|खाना|பணம்|மருத்துவமனை|அவசர|உணவு/.test(x))k=2;
  else if(/tailor|stitch|work|job|maid|garden|driver|cook|paint|electric|plumb|guard|deliver|काम|नौकरी|दर्जी|सिलाई|வேலை|தையல்/.test(x))k=0}
 const to=["work","schol","emerg","call","learn"][k],r=t("ai_r")[k];
 const u=x0.replace(/[<>&]/g,"");
 $("aichat").innerHTML=`<div class="card"><p><b>${t("ai_you")}:</b> ${u}</p><p><b>${t("ai_bot")}:</b> ${r}</p><button class="btn" onclick="go('${to}')">${t("ai_open")}</button></div>`+$("aichat").innerHTML;$("aitxt").value="";
 say([[r,SR[cur]]])}

/* provider pages (employer, sponsor, NGO, community) stay in English */
let pool=50000,vc=0;
const REQ=[["Medical",3000,"Ward 4"],["Food shortage",1500,"Ward 2"],["Accident",5000,"Ward 6"]];
const NQ=[["Worker: Lakshmi (Tailor)","Ward 4"],["Employer: Sri Tailors","Market road"],["Worker: Ravi (Driver)","Ward 6"],["Employer: Green Colony House","Green Colony"]];
const inr=n=>"₹"+n.toLocaleString("en-IN");
let ngoIn=false;
function role(r){if(r==="w")go("home");else{go("prov");pTab("e")}}
function pTab(x){$("ptabs").innerHTML=(ngoIn?[["e","Employer"],["s","Sponsor"],["n","NGO / Volunteer"]]:[["e","Employer"],["s","Sponsor"]]).map(y=>`<button class="chip ${y[0]===x?"on":""}" onclick="pTab('${y[0]}')">${y[1]}</button>`).join("");$("pv").innerHTML=x==="e"?empH():x==="s"?spH():ngoIn?ngH():ngLogin()}
function empH(){return `<div class="card"><h3>Post a job</h3><p>Role</p><select id="jr">${Object.keys(J).map(k=>`<option>${k}</option>`).join("")}</select><p>Area</p><input type="text" id="ja" placeholder="e.g. Ward 4" style="width:100%"><p>Pay</p><input type="text" id="jp" placeholder="e.g. ₹500/day" style="width:100%"><button class="btn" onclick="postJob()">Post job</button></div><div id="pj"></div>`}
function postJob(){const r=$("jr").value,a=$("ja").value.replace(/[<>&]/g,""),p=$("jp").value.replace(/[<>&]/g,"");if(!a||!p)return;J[r].unshift([r+" needed",a+" · new",p]);$("pj").innerHTML=`<div class="card"><h3>Posted ✅</h3><p>${r} · ${a} · ${p}</p><p>Sent to the NGO partner for verification. Nearby workers will see it under Find Work (shown instantly in this demo).</p><p><b>Applicants so far: 0</b></p></div>`+$("pj").innerHTML;$("ja").value="";$("jp").value=""}
function spH(){return `<div class="card" style="background:#0B2545;color:#fff"><h3>Your sponsor fund</h3><p style="color:#cbd5e1">Available: <b id="pool">${inr(pool)}</b></p></div><h3 style="margin:12px 0 8px">Emergency requests (verified by NGO)</h3>`+REQ.map((r,i)=>`<div class="card"><h3>${r[0]} · ${inr(r[1])}</h3><p>📍 ${r[2]}</p><button class="btn" onclick="appr(this,${i})">Approve</button></div>`).join("")+`<h3 style="margin:12px 0 8px">Sponsor a student</h3><div class="card"><p>Cover one term of school fees for a child.</p><button class="btn alt" onclick="this.textContent='Thank you! Sponsorship noted (demo)'">Sponsor ₹5,000</button></div>`}
function appr(b,i){if(REQ[i][1]>pool){b.textContent="Not enough funds";return}pool-=REQ[i][1];$("pool").textContent=inr(pool);b.textContent="Approved ✅ money sent";b.disabled=true}
function ngH(){return `<div class="card" style="background:#0B2545;color:#fff"><h3>Verification queue</h3><button class="chip" onclick="ngoIn=false;pTab('e')">Log out</button><p style="color:#cbd5e1">Verified today: <b id="vc">${vc}</b></p></div>`+NQ.map(q=>`<div class="card"><h3>${q[0]}</h3><p>📍 ${q[1]}</p><div style="display:flex;gap:8px"><button class="btn" onclick="ver(this,1)">Verify</button><button class="btn red" onclick="ver(this,0)">Reject</button></div></div>`).join("")}
function menu(o){$("drawer").classList.toggle("open",!!o)}
function ngLogin(){return `<div class="card"><h3>🔒 NGO partners and volunteers only</h3><p>Enter the access code given by your NGO to verify workers and employers.</p><input type="password" id="npin" placeholder="Access code" style="width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:15px;margin:8px 0"><button class="btn" onclick="ngLog()">Log in</button><p id="nerr" style="color:var(--red)"></p><p class="say">Demo code: NGO2026</p></div>`}
function ngLog(){if($("npin").value==="NGO2026"){ngoIn=true;pTab("n")}else $("nerr").textContent="Wrong code. Only NGO partners and volunteers can enter."}
function nav(p){menu(0);if(p==="h")role("w");else if(p==="s"){role("p");pTab("s")}else if(p==="e")role("p");else if(p==="n"){role("p");pTab("n")}else if(p==="c"){go("comm");$("comm").innerHTML=commH()}}
function commH(){const c=(a,b,d)=>`<div class="card"><h3>${a}</h3><p>${b}</p>${d||""}</div>`;return `<div class="card" style="background:#0B2545;color:#fff"><h3>Community page</h3><p style="color:#cbd5e1">News, stories and volunteers from your area (sample data)</p></div><h3 style="margin:12px 0 8px">Announcements</h3>`+c("Scholarship help camp","Saturday 10 AM · Community hall · Volunteers will help fill forms.")+c("Free tailoring skill workshop","Next Monday · Ward 4 · Sponsored by a local NGO partner.")+`<h3 style="margin:12px 0 8px">Success stories</h3>`+c("Lakshmi, tailor","Found steady stitching orders through SkillBridge and now earns a regular monthly income.")+c("Ravi, driver","Got a verified job near home and used the emergency fund once for his mother's treatment.")+`<h3 style="margin:12px 0 8px">Join us</h3>`+c("Become a volunteer","Help families register, fill scholarship forms or run a village help desk.",`<button class="btn alt" onclick="this.textContent='Thank you! A coordinator will contact you (demo)'">I want to volunteer</button>`)}
function ver(b,ok){if(ok){vc++;$("vc").textContent=vc}b.parentNode.innerHTML=ok?"<p>✅ Verified. Shows the NGO verified badge.</p>":"<p>❌ Rejected</p>"}

setLang("English");
</script>

</body></html>
